# ============================================================================
# QQQ Alpha Engine — Strategy Configuration
# ============================================================================
# ACTIVE STRATEGY (v6.0.0): Volatility-target QQQ
#   - Each day, target exposure = min(1.5, 20% / trailing 21-day realised volatility of QQQ)
#   - Up to 1.0x held in QQQ (rest in T-bills); above 1.0x, part of QQQ moves to QLD (2x) - no margin
#   - Signal at the completed close, trade at the next open, only when the target moves 10+ points
#     from the exposure held (or crosses 1.0x)
#   - Scripts: scripts/run_voltarget_backtest.py, scripts/run_production_voltarget.py
#
# PREVIOUS STRATEGY (v5.0.0, kept for reference): quarterly PIT Top-8/Top-16 cap-weight + QQQ 200-day
#   rule. Its scripts still read `portfolio_rules`, `trend_filter`, `cash_management` and
#   `friction_model` below. It was replaced because it trailed QQQ over 2011-2016 (see README).
# ============================================================================

version: "6.0.0-qqq-voltarget-1.5x"
strategy_name: "QQQ Volatility Target 20% (max 1.5x via QLD) with T-bill cash"

volatility_target:
  signal_symbol: "QQQ"
  target_vol: 0.20
  max_exposure: 1.5
  lookback_days: 21
  rebalance_deadband: 0.10
  leverage_etf: "QLD"
  tbill_etf: "SGOV"
  tbill_etf_fallback: "BIL"
  signal_evaluation: "completed_daily_close"
  intraday_close_cutoff_et: "16:05"
  execution_timing: "next_open"
  backtest_cost_bps: 10.0
  backtest_cash_series: "FRED_DTB3_LAGGED_1D"

# ---------------------------------------------------------------------------
# Second live plan: Big Eight Weather Plan (no leverage)
# 8 largest Nasdaq-100 members by point-in-time market cap, cap-weighted, quarterly line-up;
# invested fraction set by QQQ volatility, never above 100%, rest in T-bills.
# ---------------------------------------------------------------------------
big_eight:
  top_n: 8
  weighting_scheme: "market_cap_proportional"
  reconstitution_cadence: "quarterly"
  reconstitution_execution: "first_open_after_quarter_end"
  excluded_dual_class_tickers: ["GOOG"]
  signal_symbol: "QQQ"
  target_vol: 0.20
  max_exposure: 1.0
  lookback_days: 21
  rebalance_deadband: 0.10
  tbill_etf: "SGOV"
  tbill_etf_fallback: "BIL"
  execution_timing: "next_open"
  backtest_cost_bps: 10.0
  backtest_start: "2011-02-01"

# ---------------------------------------------------------------------------
# Previous strategy v5.0.0 (reference only)
# ---------------------------------------------------------------------------
portfolio_rules:
  default_top_k: 8
  supported_top_k: [8, 16]
  weighting_scheme: "market_cap_proportional"
  reconstitution_cadence: "quarterly"
  deduplicate_dual_share_classes: true
  excluded_dual_class_tickers: ["GOOG"]
  allow_tqqq: false
  allow_option_collars: false
  allow_margin: false

trend_filter:
  signal_symbol: "QQQ"
  ma_type: "SMA"
  ma_window_days: 200
  signal_evaluation: "completed_daily_close"
  intraday_close_cutoff_et: "16:05"
  execution_timing: "next_open"

cash_management:
  live_tbill_etf: "SGOV"
  fallback_tbill_etf: "BIL"
  backtest_cash_series: "FRED_DTB3_LAGGED_1D"

friction_model:
  base_cost_bps: 10.0
  stress_2x_cost_bps: 20.0
  stress_3x_cost_bps: 30.0
